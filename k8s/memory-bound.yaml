# Deployment com 1 réplica e limite de memória igual ao mem_limit do compose (512 MiB).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-bound
  namespace: poi
spec:
  replicas: 1
  selector:
    matchLabels: {app: memory-bound}
  template:
    metadata:
      labels: {app: memory-bound}
    spec:
      containers:
        - name: memory-bound
          image: cesarimperas/poi-memory-bound:1.0
          ports: [{containerPort: 3000}]
          env:
            - {name: PORT, value: "3000"}
            - {name: MAX_INFLIGHT_MB, value: "320"}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: 3000}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: memory-bound
  namespace: poi
spec:
  type: NodePort
  selector: {app: memory-bound}
  ports:
    - {port: 3000, targetPort: 3000, nodePort: 30002}
