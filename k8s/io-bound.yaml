# StatefulSet com uma aplicação que grava em disco. Cada pod recebe um volume persistente próprio (PVC).
apiVersion: v1
kind: Service
metadata:
  name: io-bound-headless
  namespace: poi
spec:
  clusterIP: None
  selector: {app: io-bound}
  ports:
    - {port: 3000, targetPort: 3000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: io-bound
  namespace: poi
spec:
  serviceName: io-bound-headless
  replicas: 1
  selector:
    matchLabels: {app: io-bound}
  template:
    metadata:
      labels: {app: io-bound}
    spec:
      securityContext:
        fsGroup: 1000          # usuário node da imagem
      containers:
        - name: io-bound
          image: jpedro8azevedo/poi-io-bound:1.0
          ports: [{containerPort: 3000}]
          env:
            - {name: PORT, value: "3000"}
            - {name: DATA_DIR, value: /data}
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: 3000}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: io-bound
  namespace: poi
spec:
  type: NodePort
  selector: {app: io-bound}
  ports:
    - {port: 3000, targetPort: 3000, nodePort: 30003}
