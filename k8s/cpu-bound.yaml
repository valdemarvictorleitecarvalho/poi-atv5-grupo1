# Deployment com uma aplicação sem estado com 2 réplicas dividindo as requisições de CPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-bound
  namespace: poi
spec:
  replicas: 2
  selector:
    matchLabels: {app: cpu-bound}
  template:
    metadata:
      labels: {app: cpu-bound}
    spec:
      containers:
        - name: cpu-bound
          image: vvictorcarvalho/poi-cpu-bound:1.0
          ports: [{containerPort: 3000}]
          env:
            - {name: PORT, value: "3000"}
            - {name: WEB_CONCURRENCY, value: "1"}   # 1 worker por pod (o container enxerga todas as CPUs da VM)
          resources:
            requests: {cpu: 500m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: 3000}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6   # um /compute pesado pode atrasar o /health
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-bound
  namespace: poi
spec:
  type: NodePort
  selector: {app: cpu-bound}
  ports:
    - {port: 3000, targetPort: 3000, nodePort: 30001}
